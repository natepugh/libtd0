[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "libtd0"
requires-python = ">=3.11"
dynamic = ["version"]

[tool.maturin]
binding = "pyo3"
features = ["pyo3/abi3-py311"]
module-name = "libtd0"