[package]
name = "pytd0"
version = "0.1.0"
edition = "2024"

[lib]
name = "pytd0"
crate-type = ["cdylib"]

[dependencies]
libtd0-core = { path = "../libtd0-core" }
multi-model = { path = "../multi-model" }

pyo3 = { version = "0.29.2", features = ["abi3", "abi3t", "experimental-inspect", "rust_decimal"] }
rust_decimal = "1.43.0"
