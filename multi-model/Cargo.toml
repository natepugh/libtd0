[package]
name = "multi-model"
version = "0.1.0"
edition = "2024"

authors = ["Nathan Pugh <natepugh@gmail.com>"]
description = "Configurable model inclusion/exclusion at compile time for libtd0. Library users should generally use the `libtd0` crate instead."
license = "GPL-3.0-or-later"
repository = "https://github.com/natepugh/libtd0"
keywords = ["libtd0", "td0"]
categories = ["parsing", "parser-implementations"]

[features]
default = [
    "model-spdsx-pro", 
]
model-spdsx-pro = [ 
    "model-ssxp", 
]

[dependencies]
# Internal crates
libtd0-core = { path = "../libtd0-core" }
libtd0-derive = { path = "../libtd0-derive" }
model-ssxp = { path = "../model-ssxp", optional = true }

# External dependencies
zerocopy = "0.8.52"
zerocopy-derive = "0.8.52"
