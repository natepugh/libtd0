[package]
name = "td0-model-ssxp"
version = "0.1.4"
edition = "2024"

authors = ["Nathan Pugh <natepugh@gmail.com>"]
description = """
SPD-SX Pro model implementation for td0, a parsing and editing library for the .TD0 e-kit/sample pad backup file format.

Rather than using this crate directly, use the `td0` crate with
the `model-spdsx-pro` feature compiled in. (as is the default.)
"""
license = "GPL-3.0-or-later"
repository = "https://github.com/natepugh/libtd0"
keywords = ["td0", "sample_pad", "spd-sx-pro"]
categories = ["parsing", "parser-implementations"]

[dependencies]
td0-core = { path = "../td0-core", version = "0.1.4" }
td0-derive = { path = "../td0-derive", version = "0.1.4" }

md-5 = "0.11.0"
zerocopy = "0.8.60"
zerocopy-derive = "0.8.60"

[dev-dependencies]
hexout = "0.3.2"
pretty_assertions = "1.4.1"


[lints.rust]
unexpected_cfgs.level = "warn"
unexpected_cfgs.check-cfg = ["cfg(faster_incomplete_compile)"]

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Avoid panics
string_slice = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
unchecked_time_subtraction = "warn"
panic_in_result_fn = "warn"

# Don't swallow errors
let_underscore_future = "warn"
let_underscore_must_use = "warn"
unused_result_ok = "warn"
assertions_on_result_states = "warn"

# Number safety
float_cmp = "warn"
float_cmp_const = "warn"
lossy_float_literal = "warn"
cast_sign_loss = "warn"
invalid_upcast_comparisons = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
cast_possible_truncation = "warn"

debug_assert_with_mut_call = "warn"
iter_not_returning_iterator = "warn"
expl_impl_clone_on_copy = "warn"
infallible_try_from = "warn"
dbg_macro = "warn"

# Tame some annoying things
must_use_candidate = "allow"
missing_panics_doc = "allow"
indexing_slicing = "allow"
